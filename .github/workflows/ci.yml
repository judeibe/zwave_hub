name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      # Every check is a make target, so CI runs what a developer runs
      # (constitution X). `make build` installs sidecar/node_modules, which
      # `make test-contract` needs, so it goes first.
      - run: make build
      - run: make lint
      - run: make test
      - run: make test-contract
